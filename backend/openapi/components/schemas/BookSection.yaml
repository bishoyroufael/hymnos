type: object
properties:
  id:
    type: string
    format: uuid
  chapter_id:
    type: string
    format: uuid
  position:
    type: integer
  name:
    type: string
    description: Name of this section (language inherited from parent chapter)
  description:
    type: string
  rubric:
    type: string
    description: Liturgical instructions or notes
  created_by:
    type: string
required:
  - id
  - chapter_id
  - position
  - name
