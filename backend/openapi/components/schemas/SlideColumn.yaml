type: object
description: A column within a slide row that contains one or more content blocks
properties:
  id:
    type: string
    format: uuid
  row_id:
    type: string
    format: uuid
  position:
    type: integer
  language_id:
    type: string
    format: uuid
    description: Reference to the language for this column (affects text direction)
required:
  - id
  - row_id
  - position
  - language_id
