type: object
description: A database view for ease of use on frontend side
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  author:
    type: string
  composer:
    type: string
  created_at:
    type: string
    format: date
  tags:
    type: array
    items:
      type: string
  slides:
    type: array
    items:
      $ref: "./SlideView.yaml"
required:
  - id
  - name
