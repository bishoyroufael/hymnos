type: object
description: >
  Book structure view - metadata plus a FLAT list of nodes in pre-order (depth-first)
  traversal order. Assemble the tree client-side via parent_id; the order also doubles
  as the presentation reading order. Slide content is fetched separately per node.
properties:
  book_id:
    type: string
    format: uuid
  name:
    type: string
  author:
    type: string
  description:
    type: string
  isbn:
    type: string
  created_by:
    type: string
  nodes:
    type: array
    items:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent node id, or null for a top-level node
        position:
          type: integer
        depth:
          type: integer
          description: 1 for top-level nodes, incrementing with nesting
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
        slide_count:
          type: integer
          description: Number of slides attached directly to this node
      required:
        - node_id
        - position
        - depth
        - name
        - slide_count
required:
  - book_id
  - name
  - nodes
