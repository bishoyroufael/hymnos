type: object
description: Book section view for quick access to a specific section with its slides
properties:
  section_id:
    type: string
    format: uuid
  position:
    type: integer
  name:
    type: string
  description:
    type: string
  rubric:
    type: string
  created_by:
    type: string
  slides:
    type: array
    items:
      $ref: "./SlideView.yaml"
required:
  - section_id
  - position
  - name
  - slides
